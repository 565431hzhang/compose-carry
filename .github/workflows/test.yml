name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Check formatting and environment
        run: |
          test -z "$(gofmt -l .)"
          test "$(id -u)" -ne 0
          docker compose version
      - run: go vet ./...
      - name: Unit, scan, binary and Compose-export tests
        env:
          COMPOSE_CARRY_TEST_COMPOSE: "1"
        run: go test -race -count=1 -v ./...
      - name: Compile Linux architectures
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - run: go test -count=1 ./...
      - run: go vet ./...
