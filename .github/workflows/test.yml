name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd64-source:
    if: github.event.repository.private == false
    uses: ./.github/workflows/linux-native.yml
    with:
      arch: amd64
      mode: source
  arm64-source:
    if: github.event.repository.private == false
    uses: ./.github/workflows/linux-native.yml
    with:
      arch: arm64
      mode: source
  amd64-target:
    if: github.event.repository.private == false
    needs: [amd64-source, arm64-source]
    uses: ./.github/workflows/linux-native.yml
    with:
      arch: amd64
      mode: target
      source_snapshot: ${{ needs.arm64-source.outputs.snapshot }}
  arm64-target:
    if: github.event.repository.private == false
    needs: [amd64-source, arm64-source]
    uses: ./.github/workflows/linux-native.yml
    with:
      arch: arm64
      mode: target
      source_snapshot: ${{ needs.amd64-source.outputs.snapshot }}
  desktop:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    name: desktop-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - name: Verify native platform and formatting
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          if ((go env GOOS) -ne $env:EXPECTED_OS) { throw 'Wrong native OS' }
          if ((go env GOARCH) -ne $env:EXPECTED_ARCH) { throw 'Wrong native architecture' }
          go version
          $files = gofmt -l .
          if ($LASTEXITCODE -ne 0 -or $files) { throw 'Formatting check failed' }
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Build installable packages locally
        run: go run ./cmd/package-release --out dist
      - name: Verify package contents, checksums and native binary
        env:
          COMPOSE_CARRY_RELEASE_DIR: ../../dist
        run: go test -count=1 ./cmd/package-release -run TestReleaseArtifacts -v
      - name: Remove local packages
        if: always()
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
